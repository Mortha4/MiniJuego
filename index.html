<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de Computadoras FIUBA</title>
<style>
:root{--bg:#dfe7ec;--ink:#0a192f;--cy:#22d3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d18}}
:root[data-theme="dark"]{--bg:#060d18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:#e2e8f0;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;padding:12px}
#wrap{position:relative;container-type:inline-size;width:100%;max-width:800px;aspect-ratio:4/3;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#0a192f;box-shadow:0 10px 40px rgba(0,0,0,.35)}
canvas#c{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;padding:2cqw;text-align:center;
background-color:#0a192f;background-image:linear-gradient(rgba(34,211,238,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.09) 1px,transparent 1px),radial-gradient(circle at 50% 40%,rgba(30,64,120,.55),transparent 70%);
background-size:40px 40px,40px 40px,100% 100%;animation:grid 8s linear infinite}
.ov.dim{background-color:rgba(10,25,47,.86);background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px)}
@keyframes grid{to{background-position:40px 40px,40px 40px,0 0}}
.ov{transition:opacity .35s,visibility .35s}
.ov.hide{opacity:0;visibility:hidden;pointer-events:none}
canvas#c{touch-action:manipulation}
h1{margin:0;font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:max(15px,2.6cqw);line-height:1.1;color:#cffafe;letter-spacing:.06em;text-shadow:0 0 10px #22d3ee,0 0 30px rgba(34,211,238,.55)}
h1 b{display:block;font-size:1.9em;letter-spacing:.2em;color:#fff}
.sub{font-size:max(10px,1.7cqw);color:#7dd3fc;margin:0}
.card{width:100%;border:1px solid rgba(34,211,238,.55);background:rgba(15,23,42,.72);border-radius:8px;padding:1.2cqw 2.6cqw;box-shadow:0 0 0 1px rgba(34,211,238,.1) inset,0 0 24px rgba(34,211,238,.14)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:.55cqw 0;font-size:max(10px,1.6cqw);border-bottom:1px dashed rgba(148,163,184,.28);text-align:left}
kbd{font:inherit;display:inline-block;padding:1px .8cqw;margin-left:4px;border:1px solid #22d3ee;border-radius:4px;background:rgba(34,211,238,.1);color:#a5f3fc}
.parts{display:flex;justify-content:space-around;padding-top:1cqw}
.part{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:max(9px,1.6cqw);color:#bae6fd}
.ic{width:max(40px,7cqw);height:auto}
button{font:inherit;font-weight:700;font-size:max(12px,2.2cqw);letter-spacing:.12em;padding:1.2cqw 5cqw;border:2px solid #22d3ee;border-radius:6px;background:rgba(34,211,238,.12);color:#67e8f9;cursor:pointer;
box-shadow:0 0 14px rgba(34,211,238,.35);transition:background .2s,color .2s,transform .2s,box-shadow .2s}
button:hover{background:#22d3ee;color:#0a192f;transform:translateY(-2px);box-shadow:0 6px 26px rgba(34,211,238,.65)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#final{margin:0;font-size:max(12px,2.2cqw);line-height:1.7;color:#e0f2fe}
.mrow{display:flex;align-items:center;justify-content:center;gap:3cqw;width:96%}
.mleft{flex:0 0 36%;display:flex;flex-direction:column;align-items:center;gap:1.6cqw}
.mright{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.6cqw}
.logo{width:max(64px,16.25cqw);aspect-ratio:1;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 3px rgba(34,211,238,.7),0 0 28px rgba(34,211,238,.6)}
.logo canvas{display:block;width:100%;height:100%}
.rank{padding:1cqw 2.2cqw}
.rt{font-size:max(10px,1.5cqw);font-weight:700;letter-spacing:.06em;color:#67e8f9;text-align:left;padding-bottom:.6cqw;border-bottom:1px solid rgba(34,211,238,.4)}
.rr{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:center;padding:.4cqw .6cqw;font-size:max(10px,1.6cqw);border-bottom:1px dashed rgba(148,163,184,.2);text-align:left;color:#94a3b8}
.rr span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr span:last-child{font-weight:700;text-align:right}
.rr span:first-child{font-weight:700;text-align:center;border-radius:1em}
.r1{color:#fde68a}.r2{color:#e2e8f0}.r3{color:#f0b27a}
.r1 span:first-child{background:#fbbf24;color:#0a192f}.r2 span:first-child{background:#cbd5e1;color:#0a192f}.r3 span:first-child{background:#d28b4f;color:#0a192f}
.rr.me{background:rgba(34,211,238,.16);box-shadow:inset 0 0 0 1px #22d3ee;border-radius:4px}
.btns{display:flex;gap:2cqw}.btns button{padding:1.2cqw 3cqw}
button.ghost{border-color:#64748b;color:#cbd5e1;background:transparent;box-shadow:none}
button.ghost:hover{background:#cbd5e1;color:#0a192f;box-shadow:0 6px 22px rgba(203,213,225,.4)}
#over .card{width:min(80%,400px)}
.nm{width:min(82%,400px);display:flex;flex-direction:column;gap:1.6cqw;padding:2.4cqw 3cqw}
.nm label{font-size:max(12px,2cqw);color:#a5f3fc;font-weight:700}
.nm input{font:inherit;font-size:max(13px,2.3cqw);padding:1cqw 1.4cqw;border:2px solid #22d3ee;border-radius:6px;background:#0b1730;color:#f8fafc;text-align:center;outline:none}
.nm input:focus{box-shadow:0 0 14px rgba(34,211,238,.6)}
@media (prefers-reduced-motion:reduce){.ov{animation:none;transition:none}button{transition:none}}
.mode{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:.5cqw;text-align:left;letter-spacing:.03em;padding:1.1cqw 2cqw;background:rgba(15,23,42,.72)}
.mode .mt{font-size:max(11px,1.9cqw)}
.mode .md{font-size:max(9px,1.35cqw);font-weight:400;letter-spacing:0;color:#bae6fd;transition:color .2s}
.mode:hover .md,.mode:hover .part{color:#0a192f}
.mode .parts{width:100%;padding-top:.2cqw}.mode .ic{width:max(30px,5cqw)}
.tabs{display:flex;gap:1cqw;padding-top:.7cqw}
.tabs button{font-size:max(9px,1.25cqw);padding:.3cqw 1.4cqw;letter-spacing:.04em}
.tabs button.on{border-color:#22d3ee;color:#67e8f9;background:rgba(34,211,238,.14)}
#over{gap:1.2cqw}#over .facts{width:min(92%,560px);padding:.9cqw 2cqw}
.fx{font-size:max(9px,1.45cqw);text-align:left;color:#e0f2fe;padding:.3cqw 0;line-height:1.35}
.mode{padding:1.5cqw 2.2cqw}
#bmenu{position:absolute;right:4px;bottom:3px;display:none;z-index:5;font-size:max(9px,1.25cqw);padding:.2cqw 1cqw;letter-spacing:.06em}
#pauseOv{background-color:rgba(6,13,24,.78);background-image:repeating-linear-gradient(0deg,rgba(34,211,238,.05) 0 1px,transparent 1px 4px);animation:none;z-index:6}
.pz{width:min(78%,440px);display:flex;flex-direction:column;align-items:stretch;gap:1.5cqw;padding:0 0 2.2cqw;overflow:hidden}
.pbar{background:#22d3ee;color:#0a192f;font-weight:700;font-size:max(9px,1.3cqw);letter-spacing:.1em;padding:.5cqw 1.6cqw;text-align:left}
.pz h1,.pz .sub,.pz button{margin-left:2.4cqw;margin-right:2.4cqw}
.pb{text-align:center;letter-spacing:.1em;padding:1.2cqw 2cqw}
.pb.on{background:#22d3ee;color:#0a192f;transform:translateY(-2px);box-shadow:0 6px 26px rgba(34,211,238,.65)}
.pz .small{font-size:max(8px,1.2cqw);color:#64748b}
.card,.pz{backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);background:linear-gradient(135deg,rgba(30,58,100,.38),rgba(10,25,47,.62));border-color:rgba(165,243,252,.5);box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),0 0 24px rgba(34,211,238,.18)}
button{position:relative;overflow:hidden}
button::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s}
button:hover::after{left:140%}button:active{transform:scale(.96)}
.ov:not(.hide)>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ov>*{animation:none!important}button::after{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <button id="bmenu" class="ghost" title="Volver al menú (Esc)">☰ MENÚ (Esc)</button>
  <div class="ov" id="menu">
    <div class="mrow">
      <div class="mleft">
        <div class="logo"><canvas id="logoC" width="260" height="260"></canvas></div>
        <h1>Facultad de Ingeniería <b>FIUBA</b></h1>
        <p class="sub">Elegí un minijuego</p>
      </div>
      <div class="mright">
        <button class="mode" id="mLab"><span class="mt">1 · LABORATORIO DE HARDWARE</span>
          <span class="md">Elegí tu técnico y reparás PCs antes de que se acabe el tiempo · WASD/Flechas, E/Espacio (mantener E: limpiar/desoldar), Q soltar</span>
          <span class="parts"><span class="part"><canvas class="ic" width="72" height="48" data-p="ram"></canvas>RAM</span><span class="part"><canvas class="ic" width="72" height="48" data-p="hdd"></canvas>Disco Duro</span><span class="part"><canvas class="ic" width="72" height="48" data-p="mobo"></canvas>Placa Madre</span></span></button>
        <button class="mode" id="mQuiz"><span class="mt">2 · ESCUDO CIBERSEGURIDAD FIUBA</span>
          <span class="md">5 alertas de seguridad: frená phishing, malware y más antes de que te hackeen · mouse, touch o teclado 1-4 / Enter</span></button>
        <div class="card rank" id="rankMenu"></div>
      </div>
    </div>
  </div>
  <div class="ov dim hide" id="nameOv">
    <div class="card nm">
      <label for="pname">Identificación del técnico</label>
      <input id="pname" type="text" maxlength="15" placeholder="Técnico FIUBA" autocomplete="off" spellcheck="false">
      <button id="go">COMENZAR</button>
    </div>
  </div>
  <div class="ov hide" id="pauseOv">
    <div class="card pz">
      <div class="pbar">&gt; FIUBA_LAB.SYS // PAUSA</div>
      <h1 id="pauseT">JUEGO EN PAUSA</h1>
      <p class="sub">Tiempo detenido · tu partida te espera</p>
      <button class="pb on" id="pResume">RETOMAR PARTIDA</button>
      <button class="pb" id="pMenu">VOLVER AL MENÚ PRINCIPAL</button>
      <p class="sub small">W/S o ↑/↓ elegir · Enter/Espacio confirmar · Esc retomar</p>
    </div>
  </div>
  <div class="ov dim hide" id="over">
    <h1 id="overT">Turno terminado</h1>
    <p class="sub" id="fname"></p>
    <p id="final"></p>
    <div class="card facts" id="facts" style="display:none"></div>
    <div class="card rank" id="rankOver"></div>
    <div class="btns"><button id="again">REINICIAR TURNO</button><button id="tomenu" class="ghost">MENÚ PRINCIPAL</button></div>
  </div>
</div>
<script>
/* ===== Configuración ===== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=600,HUD=55,FONT='"Courier New",monospace';
const PARTS={ram:'RAM',hdd:'DISCO DURO',mobo:'PLACA MADRE'};
const KEYS=Object.keys(PARTS);
const desks=[70,320,570].map(x=>({x,y:140,w:160,h:100}));
const shelves=[{x:60,y:500,w:130,h:70,part:'ram'},{x:230,y:500,w:130,h:70,part:'hdd'},{x:400,y:500,w:130,h:70,part:'mobo'}];
const trash={x:620,y:500,w:120,h:70};
const labSolids=[...desks,...shelves,trash];let solids=labSolids;
let best=0;try{best=+localStorage.getItem('pcrr_best')||0}catch(e){}
const $=id=>document.getElementById(id);

/* ===== Ranking de técnicos (localStorage) ===== */
const RANK_KEY='fiuba_pc_repair_ranking',NAME_KEY='fiuba_pc_repair_name';
let ranking=[],playerName='Técnico FIUBA',lastEntry=null;
try{const r=JSON.parse(localStorage.getItem(RANK_KEY));if(Array.isArray(r))ranking=r.filter(e=>e&&typeof e.name==='string'&&Number.isFinite(e.score))}catch(e){}
try{playerName=localStorage.getItem(NAME_KEY)||playerName}catch(e){}
ranking.sort((a,b)=>b.score-a.score);ranking=ranking.slice(0,5);
best=Math.max(best,ranking.length?ranking[0].score:0);
function addScore(name,score){
  lastEntry={name,score};ranking.push(lastEntry);
  ranking.sort((a,b)=>b.score-a.score); // empates: queda arriba el más antiguo
  ranking=ranking.slice(0,5);
  try{localStorage.setItem(RANK_KEY,JSON.stringify(ranking))}catch(e){}
}
function renderRank(box,hl,lst=ranking,title='RANKING DE TÉCNICOS (TOP 5)'){
  box.innerHTML='<div class="rt">'+title+'</div>';
  for(let i=0;i<5;i++){
    const e=lst[i],row=document.createElement('div');row.className='rr r'+(i+1)+(e&&e===hl?' me':'');
    [ '#'+(i+1), e?e.name:'---', e?e.score:'—' ].forEach(t=>{const sp=document.createElement('span');sp.textContent=t;row.append(sp)});
    box.append(row);
  }
}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ===== Audio procedural ===== */
let AC=null,OUT=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();OUT=AC.createDynamicsCompressor();OUT.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='square',vol=.07,slide=0,delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=Math.min(9000,f*5+500);o.connect(fl).connect(g).connect(OUT);o.start(t);o.stop(t+d);
}
const sfx={
  pick:()=>{tone(520,.08);tone(780,.1,'square',.06,0,.07)},
  drop:()=>tone(300,.12,'triangle',.08,-120),
  swap:()=>{tone(440,.07,'square',.06);tone(330,.07,'square',.06,0,.06);tone(660,.1,'square',.06,0,.12)},
  toss:()=>tone(260,.16,'triangle',.045,-110),
  ok:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.07,0,i*.08))},
  bad:()=>tone(130,.35,'sawtooth',.09,-40),
  warn:()=>tone(900,.07,'square',.05),
  step:()=>{tone(600,.08);tone(900,.12,'square',.06,0,.07)},
  power:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.09,'triangle',.07,0,i*.05))},
  over:()=>{tone(400,.9,'sawtooth',.1,-340);tone(200,1.1,'square',.07,-160,.2)}
};

/* ===== Estado ===== */
let state='menu',G,paused=false,pIdx=0;
function reset(){
  G={score:0,fixed:0,level:1,carry:null,t:0,overT:0,warnT:0,shake:0,streak:0,rest:{ram:0,hdd:0,mobo:0},pu:null,puT:rnd(20,25),boost:0,trail:[],trailT:0,workT:0,
     p:{x:400,y:390,r:14,ang:Math.PI/2,step:0,moving:false},
     pcs:desks.map((d,i)=>({d,cx:d.x+d.w/2,state:'ok',cool:2+i*2.5+Math.random()*2,need:null,t:0,max:1,err:0,ok:0,pre:null,prog:0})),
     parts:[],msgs:[]};
}
reset();

/* ===== Entrada ===== */
const keys={};let actPressed=false,dropPressed=false;
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return; // no interferir al escribir el nombre
  const k=e.key.toLowerCase();
  if(e.repeat&&(k==='enter'||k==='escape'))return;
  if(paused){ // menú de pausa: W/S, flechas, Enter/Espacio y Esc
    if(['arrowup','arrowdown',' '].includes(k))e.preventDefault();
    if(k==='escape')closePause();
    else if(['w','arrowup','s','arrowdown'].includes(k)){pIdx=pIdx?0:1;pauseUI();sfx.pick()}
    else if(k==='enter'||k===' '||k==='e')pIdx?toMenu():closePause();
    return;
  }
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(!keys[k]&&(k==='e'||k===' '))actPressed=true;
  if(!keys[k]&&(k==='q'||k==='x'))dropPressed=true;
  keys[k]=true;
  if(k==='escape'){if(state==='play')openPause();else if(['qplay','over','qover','sel'].includes(state))toMenu()}
  if(state==='sel')selKey(k);
  if(state==='qplay'){if(/^[1-4]$/.test(k))qPick(+k-1);else if(k==='enter'||k===' '||k==='e')qBtnNext()}
  if(k==='enter'){if(state==='menu')openName('lab');else if((state==='over'||state==='qover')&&!$('over').classList.contains('hide'))startCurrent()}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

/* ===== Utilidades ===== */
function distRect(px,py,r){const dx=Math.max(r.x-px,0,px-(r.x+r.w)),dy=Math.max(r.y-py,0,py-(r.y+r.h));return Math.hypot(dx,dy)}
function burst(x,y,cols,n=18,sp=140){if(!Array.isArray(cols))cols=[cols];for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,max:1,col:cols[i%cols.length],sz:2+Math.random()*3,g:380,fl:y+rnd(14,34)})}}
function float(x,y,text,col){G.msgs.push({x,y,text,col,life:1.2})}
function levelParams(){
  const L=G.level;
  return{limit:Math.max(7,17-L*1.1),coolMin:Math.max(1,4.5-L*.4),coolRange:Math.max(1.5,4-L*.25),maxBroken:L<3?2:3};
}

/* ===== Lógica ===== */
function start(){audio();music.start();paused=false;$('pauseOv').classList.add('hide');reset();solids=labSolids;mode='lab';state='play';$('menu').classList.add('hide');$('over').classList.add('hide');$('nameOv').classList.add('hide')}
function openName(m){
  if(state!=='menu')return;mode=m||'lab';state='name';audio();
  document.querySelector('#nameOv label').textContent=mode==='quiz'?'Identificación del jugador':'Identificación del técnico';
  const i=$('pname');i.value=playerName==='Técnico FIUBA'?'':playerName;
  $('nameOv').classList.remove('hide');setTimeout(()=>{i.focus();i.select()},30);
}
function confirmName(){
  playerName=$('pname').value.trim().slice(0,15)||'Técnico FIUBA';
  try{localStorage.setItem(NAME_KEY,playerName)}catch(e){}
  afterName();
}
function toMenu(){music.stop();paused=false;$('pauseOv').classList.add('hide');state='menu';mode='lab';solids=labSolids;Q=null;selLock=false;reset();$('over').classList.add('hide');$('nameOv').classList.add('hide');renderMenuRank();$('menu').classList.remove('hide')}
function gameOver(pc){
  state='over';music.stop();setOverUI('lab');G.overT=0;sfx.over();G.shake=.5;burst(pc.cx,pc.d.y+40,'#555',40,200);burst(pc.cx,pc.d.y+40,'#ffd43b',30,260);
  if(G.score>best){best=G.score;try{localStorage.setItem('pcrr_best',best)}catch(e){}}
  document.getElementById('final').innerHTML='Puntuación final: <b>'+G.score+'</b><br>Computadoras reparadas: '+G.fixed+'<br>Récord: <b>'+best+'</b>';
  G.deadPc=pc;
  if(G.score>0)addScore(playerName,G.score);else lastEntry=null;
  $('fname').textContent='Técnico: '+playerName;renderRank($('rankOver'),lastEntry);renderMenuRank();
}
function nearest(){
  const p=G.p;let bestT=null,bd=40;
  const test=(r,kind,ref)=>{const d=distRect(p.x,p.y,r);if(d<bd){bd=d;bestT={kind,ref,r}}};
  shelves.forEach(s=>test(s,'shelf',s));
  test(trash,'trash',trash);
  G.pcs.forEach(pc=>test(pc.d,'pc',pc));
  return bestT;
}
function interact(){
  const t=nearest();if(!t)return;
  if(t.kind==='shelf'){
    if(G.rest[t.ref.part]>0){float(G.p.x,G.p.y-34,'Reponiendo...','#fbbf24');sfx.bad()}
    else if(G.carry===t.ref.part){float(G.p.x,G.p.y-30,'Ya la llevas','#cbd5e1')}
    else{const swap=!!G.carry;G.carry=t.ref.part;

function update(dt){
  const P=levelParams();
  if(state==='play'){
    const p=G.p;let mx=0,my=0;
    if(keys['a']||keys['arrowleft'])mx--;if(keys['d']||keys['arrowright'])mx++;
    if(keys['w']||keys['arrowup'])my--;if(keys['s']||keys['arrowdown'])my++;
    p.moving=!!(mx||my);
    if(p.moving){const l=Math.hypot(mx,my);mx/=l;my/=l;
      // giro suave hacia la dirección de marcha
      let da=Math.atan2(my,mx)-p.ang;da=Math.atan2(Math.sin(da),Math.cos(da));p.ang+=da*Math.min(1,dt*16);
      p.step+=dt*11;if(Math.floor(p.step/Math.PI)!==p.fp){p.fp=Math.floor(p.step/Math.PI);sfx.foot()}const sp=190*(G.boost>0?1.4:1)*dt;
      p.x+=mx*sp;resolve(p,true);p.y+=my*sp;resolve(p,false);}
    if(actPressed)interact();
    if(dropPressed&&G.carry){penalize(p.x,p.y-26,G.carry);G.carry=null;sfx.toss();burst(p.x,p.y-20,'#94a3b8',10,80);float(p.x,p.y-50,'-1 pieza','#cbd5e1')}
    // --- Paso previo: mantener E/Espacio 1.5 s con las manos vacías
    const hold=keys['e']||keys[' '],nt=nearest();
    G.pcs.forEach(pc=>{
      const act=hold&&!G.carry&&pc.state==='broken'&&pc.pre&&nt&&nt.ref===pc;
      if(act){
        pc.prog+=dt;G.workT-=dt;
        if(G.workT<=0){G.workT=.1;pc.pre==='dust'?sfx.air():sfx.spark()}
        if(pc.pre==='dust'){if(Math.random()<dt*50)G.parts.push({x:p.x+Math.cos(p.ang)*20,y:p.y+Math.sin(p.ang)*20,vx:(pc.cx-p.x)*1.4+rnd(-30,30),vy:(pc.d.y+60-p.y)*1.4+rnd(-30,30),g:0,life:.5,max:.5,col:'#bae6fd',circ:true,r:2.5,grow:3})}
        else if(Math.random()<dt*60)G.parts.push({x:pc.cx+rnd(-12,12),y:pc.d.y+55,vx:rnd(-70,70),vy:-rnd(40,120),life:.45,max:.45,col:Math.random()<.5?'#fb923c':'#fde047',sz:2+Math.random()*2});
        if(pc.prog>=1.5)finishPre(pc);
      }else pc.prog=Math.max(0,pc.prog-dt*2.5);
    });
    // --- Reposición de estantes y power-ups
    for(const k of KEYS)G.rest[k]=Math.max(0,G.rest[k]-dt);
    G.puT-=dt;
    if(G.puT<=0){G.puT=rnd(20,25);if(!G.pu){const d=desks[Math.random()*3|0];G.pu={type:Math.random()<.5?'mate':'cafe',x:d.x+132,y:d.y+81}}}
    if(G.pu&&Math.hypot(p.x-G.pu.x,p.y-G.pu.y)<48){G.boost=10;sfx.power();burst(G.pu.x,G.pu.y,['#fde047','#4ade80','#ffffff'],24,170);float(p.x,p.y-34,'¡Velocidad +40%!','#fde047');G.pu=null}
    if(G.boost>0){G.boost=Math.max(0,G.boost-dt);if(p.moving){G.trailT-=dt;if(G.trailT<=0){G.trailT=.03;G.trail.push({x:p.x,y:p.y,l:.35})}}}
    G.trail.forEach(q=>q.l-=dt);G.trail=G.trail.filter(q=>q.l>0);
    G.pcs.forEach(pc=>{
      pc.err=Math.max(0,pc.err-dt);pc.ok=Math.max(0,pc.ok-dt);
      if(pc.state==='ok'){pc.cool-=dt;
        const nb=G.pcs.filter(x=>x.state==='broken').length;
        if(pc.cool<=0&&nb<P.maxBroken){pc.state='broken';pc.need=KEYS[Math.random()*3|0];pc.pre=Math.random()<.4?(Math.random()<.5?'dust':'solder'):null;pc.prog=0;pc.max=pc.t=P.limit+(pc.pre?3:0);}
        else if(pc.cool<=0)pc.cool=.8;}
      else if(pc.state==='fixed'){pc.t-=dt;if(pc.t<=0){pc.state='ok';pc.cool=P.coolMin+Math.random()*P.coolRange}}
      else if(pc.state==='broken'){
        pc.t-=dt;
        if(pc.t<pc.max*.25&&Math.random()<dt*14)G.parts.push({x:pc.cx+rnd(-16,16),y:pc.d.y+12,vx:rnd(-10,10),vy:-rnd(30,55),g:0,life:1.1,max:1.1,col:'#374151',circ:true,r:3,grow:9});
        if(pc.t<=0){pc.t=0;gameOver(pc)}}
    });
    G.warnT-=dt;
    if(G.warnT<=0&&G.pcs.some(pc=>pc.state==='broken'&&pc.t<pc.max*.3)){sfx.warn();G.warnT=.7}
  }else if(state==='qplay'||state==='qover'){qUpdate(dt);
  }else if(state==='over'){
    G.overT+=dt;if(G.overT>1.3)document.getElementById('over').classList.remove('hide');
  }
  if(state==='sel')selTick(dt);
  actPressed=false;dropPressed=false;G.t+=dt;G.shake=Math.max(0,G.shake-dt);
  G.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g===undefined?60:q.g)*dt;if(q.fl!==undefined&&q.y>q.fl&&q.vy>0){q.y=q.fl;q.vy*=-.45;q.vx*=.7}if(q.grow)q.r+=q.grow*dt;q.life-=dt});G.parts=G.parts.filter(q=>q.life>0);
  G.msgs.forEach(m=>{m.y-=32*dt;m.life-=dt});G.msgs=G.msgs.filter(m=>m.life>0);
  if(state==='over'&&G.deadPc&&Math.random()<.6)G.parts.push({x:G.deadPc.cx+rnd(-15,15),y:G.deadPc.d.y+30,vx:rnd(-15,15),vy:-rnd(60,100),life:1.2,max:1.2,col:Math.random()<.3?'#fbbf24':'#6b7280',sz:4+Math.random()*5});
}
function resolve(p,horiz){
  p.x=Math.min(W-p.r-8,Math.max(p.r+8,p.x));p.y=Math.min(H-p.r-24,Math.max(HUD+p.r+2,p.y));
  for(const s of solids){
    const cx=Math.max(s.x,Math.min(p.x,s.x+s.w)),cy=Math.max(s.y,Math.min(p.y,s.y+s.h));
    const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
    if(d<p.r){
      if(d>0.001){p.x=cx+dx/d*p.r;p.y=cy+dy/d*p.r}
      else if(horiz)p.x=p.x<s.x+s.w/2?s.x-p.r:s.x+s.w+p.r;else p.y=p.y<s.y+s.h/2?s.y-p.r:s.y+s.h+p.r;
    }
  }
}
